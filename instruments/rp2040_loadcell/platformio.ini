[platformio]
default_envs = pico

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#aa70b802be8851668053d4f09734e4089fe41932
board = generic
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 0m
board_build.arduino.earlephilhower.usb_product = RP2040 Load Cell Instrument

lib_deps =
    https://github.com/sparkfun/SparkFun_Qwiic_Scale_NAU7802_Arduino_Library.git#v1.0.6

build_flags =
    -Wall
    -Wextra
    -Werror=return-type
    -DLOADCELL_SDA_PIN=20
    -DLOADCELL_SCL_PIN=21
    ; DRDY is not routed on this board; -1 selects PU_CTRL.CR polling.
    -DLOADCELL_DRDY_PIN=-1
    ; Reported onboard indicators, all active high.
    -DLOADCELL_LED_BLUE_PIN=25
    -DLOADCELL_LED_RED_PIN=26
    -DLOADCELL_LED_GREEN_PIN=27
    -DLOADCELL_LED_ACTIVE_HIGH=1
    -DLOADCELL_I2C_INSTANCE=0
    -DLOADCELL_I2C_HZ=400000
    -DLOADCELL_DEFAULT_SAMPLE_RATE_SPS=320
    -DLOADCELL_DEFAULT_GAIN=128

monitor_speed = 115200
